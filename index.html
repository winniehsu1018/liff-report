<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場作業報工系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      margin: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 20px auto;
    }

    h2 {
      color: #212529;
      font-size: 20px;
      margin-top: 0;
      text-align: center;
    }

    .user-info {
      background: #e9ecef;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 15px;
    }

    #userName {
      color: #0d6efd;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      color: #343a40;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      box-sizing: border-box;
      font-size: 16px;
    }

    select:focus,
    input:focus {
      border-color: #06C755;
      outline: none;
    }

    button {
      background-color: #06C755;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 18px;
    }

    button:disabled {
      background-color: #adb5bd;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .loading {
      color: #0d6efd;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>現場作業報工系統</h2>

  <!-- 填報人員資訊 -->
  <div class="user-info">
    填報人員：<span id="userName">身份驗證中...</span>
  </div>

  <!-- 工作類別 -->
  <label for="workCategory">工作類別 *</label>
  <select id="workCategory" onchange="updateContentOptions()">
    <option value="">-- 請選擇工作類別 --</option>
    <option value="M01">M01 機台操作/生產操作</option>
    <option value="M02">M02 機台巡檢(設備維護)</option>
    <option value="P01">P01 前/後加工(預處理)</option>
    <option value="Q01">Q01 品質</option>
    <option value="D01">D01 文件處理</option>
    <option value="S01">S01 系統結帳</option>
    <option value="T01">T01 搬運</option>
    <option value="A01">A01 異常處理</option>
    <option value="PK1">PK1 包裝</option>
    <option value="OTH1">OTH1 其他</option>
  </select>

  <!-- 工作內容 -->
  <label for="workContent">工作內容 *</label>
  <select id="workContent" disabled>
    <option value="">-- 請先選擇工作類別 --</option>
  </select>

  <!-- 作業範圍 -->
  <label for="workScope">作業範圍 (選填)</label>
  <input type="text" id="workScope" placeholder="請填寫機台號碼或工單件號">

  <!-- 提交按鈕 -->
  <button id="submitBtn" onclick="submitData()" disabled>提交報工資料</button>

  <!-- 狀態提示 -->
  <div id="status"></div>
</div>

<script>
  // ⚠️ 請替換為您的 GAS Web App 網址與 LIFF ID
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyHHYAVUp5yNV8G26wsajzpMMaAlBzwZRTxGbOyeyESQOvM2klYdALrKf7YlM37YEkW/exec"; 
  const MY_LIFF_ID = "2011153364-MOAMyDp5";
  
  let currentProfile = null;

  // 1. LIFF 初始化 (載入頁面時自動執行)
  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        currentProfile = await liff.getProfile();
        const userInfoEl = document.getElementById("userInfo");
        if (userInfoEl) {
          userInfoEl.innerText = "已登入員工：" + currentProfile.displayName;
        }
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF 初始化失敗", err);
      alert("LIFF 載入失敗：" + err.message);
    }
  }
  initLiff();

  // 2. 按下送出按鈕時執行的函式
  async function submitReport() {
    if (!currentProfile || !currentProfile.userId) {
      alert("尚未取得您的 LINE 身份，請關閉後重新開啟頁面！");
      return;
    }

    // 💡 取得表單欄位值 (請確保 "" 內的名稱與您 HTML input 的 id 一致)
    const payload = {
      userId: currentProfile.userId,        // 傳送 User ID 供 GAS 白名單比對
      userName: currentProfile.displayName, // LINE 暱稱
      categoryCode: document.getElementById("categoryCode") ? document.getElementById("categoryCode").value : "",
      categoryName: document.getElementById("categoryName") ? document.getElementById("categoryName").value : "",
      contentCode: document.getElementById("contentCode") ? document.getElementById("contentCode").value : "",
      contentName: document.getElementById("contentName") ? document.getElementById("contentName").value : "",
      workScope: document.getElementById("workScope") ? document.getElementById("workScope").value : ""
    };

    // 發送資料給 GAS
    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(result => {
      if (result.result === "success") {
        alert(result.message); // 顯示成功訊息
        liff.closeWindow();    // 自動關閉 LIFF 視窗
      } else {
        alert(result.message); // 顯示失敗或權限不足訊息
      }
    })
    .catch(error => {
      console.error("Error:", error);
      alert("提交失敗，請檢查網路連線。");
    });
  }
</script>
</body>
</html>
