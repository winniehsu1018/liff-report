<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>現場作業報工系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      margin: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 20px auto;
    }

    h2 {
      color: #212529;
      font-size: 20px;
      margin-top: 0;
      text-align: center;
    }

    .user-info {
      background: #e9ecef;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 15px;
    }

    #userName {
      color: #0d6efd;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      color: #343a40;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      box-sizing: border-box;
      font-size: 16px;
    }

    select:focus,
    input:focus {
      border-color: #06C755;
      outline: none;
    }

    button {
      background-color: #06C755;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 18px;
    }

    button:disabled {
      background-color: #adb5bd;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .loading {
      color: #0d6efd;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>現場作業報工系統</h2>

  <!-- 填報人員資訊 -->
  <div class="user-info">
    填報人員：<span id="userName">身份驗證中...</span>
  </div>

  <!-- 工作類別 -->
  <label for="workCategory">工作類別 *</label>
  <select id="workCategory" onchange="updateContentOptions()">
    <option value="">-- 請選擇工作類別 --</option>
    <option value="M01">M01 機台操作/生產操作</option>
    <option value="M02">M02 機台巡檢(設備維護)</option>
    <option value="P01">P01 前/後加工(預處理)</option>
    <option value="Q01">Q01 品質</option>
    <option value="D01">D01 文件處理</option>
    <option value="S01">S01 系統結帳</option>
    <option value="T01">T01 搬運</option>
    <option value="A01">A01 異常處理</option>
    <option value="PK1">PK1 包裝</option>
    <option value="OTH1">OTH1 其他</option>
  </select>

  <!-- 工作內容 -->
  <label for="workContent">工作內容 *</label>
  <select id="workContent" disabled>
    <option value="">-- 請先選擇工作類別 --</option>
  </select>

  <!-- 作業範圍 -->
  <label for="workScope">作業範圍 (選填)</label>
  <input type="text" id="workScope" placeholder="請填寫機台號碼或工單件號">

  <!-- 提交按鈕 -->
  <button id="submitBtn" onclick="submitData()" disabled>提交報工資料</button>

  <!-- 狀態提示 -->
  <div id="status"></div>
</div>

<script>
// =====================================================
// 1. 基本設定
// =====================================================
const MY_LIFF_ID = "2011153364-MOAMyDp5";
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyHHYAVUp5yNV8G26wsajzpMMaAlBzwZRTxGbOyeyESQOvM2klYdALrKf7YlM37YEkW/exec";

let currentUserName = "";

// =====================================================
// 2. 工作內容對照表
// =====================================================
const contentMap = {
  "M01": [
    { code: "M01-1", text: "上料" },
    { code: "M01-2", text: "下料" },
    { code: "M01-3", text: "換刀" },
    { code: "M01-4", text: "換批" }
  ],
  "M02": [
    { code: "M02-1", text: "巡視多台機台外觀、清潔、異音、核心參數" }
  ],
  "P01": [
    { code: "P01-1", text: "甩油、零件清洗、分裝" }
  ],
  "Q01": [
    { code: "Q01-1", text: "首末件確認" },
    { code: "Q01-2", text: "抽檢" },
    { code: "Q01-3", text: "重測" },
    { code: "Q01-4", text: "挑料、挑鐵屑" }
  ],
  "D01": [
    { code: "D01-1", text: "列印、整理、歸檔" }
  ],
  "S01": [
    { code: "S01-1", text: "系統入單、結帳" }
  ],
  "T01": [
    { code: "T01-1", text: "材料、半成品、成品" }
  ],
  "A01": [
    { code: "A01-1", text: "排除異常、料片碰撞、刀具撞擊、尺寸異常" }
  ],
  "PK1": [
    { code: "PK1-1", text: "零件包裝" }
  ],
  "OTH1": [
    { code: "OTH1-1", text: "其他(請填寫)" }
  ]
};

// =====================================================
// 3. LIFF 初始化
// =====================================================
window.onload = async function () {
  const userNameElement = document.getElementById("userName");
  const submitBtn = document.getElementById("submitBtn");
  const statusDiv = document.getElementById("status");

  if (typeof liff === "undefined") {
    userNameElement.innerText = "驗證失敗";
    statusDiv.className = "error";
    statusDiv.innerText = "LINE SDK 載入失敗，請重新開啟頁面";
    return;
  }

  try {
    statusDiv.className = "loading";
    statusDiv.innerText = "正在進行身分驗證...";

    await liff.init({ liffId: MY_LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile = await liff.getProfile();
    currentUserName = profile.displayName;

    userNameElement.innerText = currentUserName;
    statusDiv.innerText = "";
    submitBtn.disabled = false;

  } catch (err) {
    console.error("LIFF Init Error:", err);
    userNameElement.innerText = "身分驗證失敗";
    statusDiv.className = "error";
    statusDiv.innerText = "連線失敗，請嘗試於 LINE 內開啟本頁面";
  }
};

// =====================================================
// 4. 工作內容選單連動
// =====================================================
function updateContentOptions() {
  const categorySelect = document.getElementById("workCategory");
  const contentSelect = document.getElementById("workContent");
  const selectedCategory = categorySelect.value;

  contentSelect.innerHTML = '<option value="">-- 請選擇工作內容 --</option>';

  if (selectedCategory && contentMap[selectedCategory]) {
    contentSelect.disabled = false;
    contentMap[selectedCategory].forEach(function(item) {
      const option = document.createElement("option");
      option.value = item.code;
      option.innerText = item.code + " " + item.text;
      contentSelect.appendChild(option);
    });
  } else {
    contentSelect.disabled = true;
  }
}

// =====================================================
// 5. 提交資料至 Google Apps Script
// =====================================================
async function submitData() {
  const categorySelect = document.getElementById("workCategory");
  const contentSelect = document.getElementById("workContent");
  const scopeInput = document.getElementById("workScope");
  const btn = document.getElementById("submitBtn");
  const statusDiv = document.getElementById("status");

  if (!currentUserName) {
    alert("尚未完成 LINE 身分驗證！");
    return;
  }

  const categoryCode = categorySelect.value;
  if (!categoryCode) {
    alert("請選擇工作類別！");
    return;
  }

  const contentCode = contentSelect.value;
  if (!contentCode) {
    alert("請選擇工作內容！");
    return;
  }

  btn.disabled = true;
  statusDiv.className = "loading";
  statusDiv.innerText = "資料傳送中...";

  const payload = {
    userName: currentUserName,
    categoryCode: categoryCode,
    categoryName: categorySelect.options[categorySelect.selectedIndex].text,
    contentCode: contentCode,
    contentName: contentSelect.options[contentSelect.selectedIndex].text,
    workScope: scopeInput.value.trim()
  };

  try {
    const response = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    const data = await response.json();

    if (data.result === "success") {
      statusDiv.className = "success";
      statusDiv.innerText = "✅ 報工成功！";

      // 成功後自動關閉 LIFF 視窗
      setTimeout(function() {
        if (liff.isInClient()) {
          liff.closeWindow();
        }
      }, 1200);
    } else {
      throw new Error(data.message || "伺服器處理失敗");
    }
  } catch (err) {
    statusDiv.className = "error";
    statusDiv.innerText = "提交失敗：" + (err.message || "網路連線異常");
    btn.disabled = false;
  }
}
</script>

</body>
</html>
