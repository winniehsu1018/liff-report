<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>現場作業報工系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      margin: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 20px auto;
    }

    h2 {
      color: #212529;
      font-size: 20px;
      margin-top: 0;
      text-align: center;
    }

    .user-info {
      background: #e9ecef;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 15px;
    }

    #userName {
      color: #0d6efd;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      color: #343a40;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      box-sizing: border-box;
      font-size: 16px;
    }

    select:focus,
    input:focus {
      border-color: #06C755;
      outline: none;
    }

    button {
      background-color: #06C755;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 18px;
    }

    button:disabled {
      background-color: #adb5bd;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    .success { color: #198754; }
    .error { color: #dc3545; }
    .loading { color: #0d6efd; }

    /* 自訂無網址彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-message {
      font-size: 16px;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.5;
      font-weight: 500;
    }

    .modal-btn {
      background-color: #06C755;
      color: white;
      border: none;
      padding: 12px 0;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>現場作業報工系統</h2>

  <!-- 填報人員資訊 -->
  <div class="user-info">
    填報人員：<span id="userName">身份驗證中...</span>
  </div>

  <!-- 工作類別 -->
  <label for="workCategory">工作類別 *</label>
  <select id="workCategory" onchange="updateContentOptions()">
    <option value="">-- 請選擇工作類別 --</option>
    <option value="M01">M01 機台操作/生產操作</option>
    <option value="M02">M02 機台巡檢(設備維護)</option>
    <option value="P01">P01 前/後加工(預處理)</option>
    <option value="Q01">Q01 品質</option>
    <option value="D01">D01 文件處理</option>
    <option value="S01">S01 系統結帳</option>
    <option value="T01">T01 搬運</option>
    <option value="A01">A01 異常處理</option>
    <option value="PK1">PK1 包裝</option>
    <option value="OTH1">OTH1 其他</option>
  </select>

  <!-- 工作內容 -->
  <label for="workContent">工作內容 *</label>
  <select id="workContent" disabled>
    <option value="">-- 請先選擇工作類別 --</option>
  </select>

  <!-- 作業範圍 -->
  <label for="workScope">作業範圍 (選填)</label>
  <input type="text" id="workScope" placeholder="請填寫機台號碼或工單件號">

  <!-- 提交按鈕 -->
  <button id="submitBtn" onclick="submitData()" disabled>提交報工資料</button>

  <!-- 狀態提示 -->
  <div id="status"></div>
</div>

<!-- 自訂無網址彈窗 HTML 結構 -->
<div id="customModal" class="modal-overlay">
  <div class="modal-box">
    <div id="modalMsg" class="modal-message">提示訊息</div>
    <button class="modal-btn" onclick="closeCustomModal()">確定</button>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyHHYAVUp5yNV8G26wsajzpMMaAlBzwZRTxGbOyeyESQOvM2klYdALrKf7YlM37YEkW/exec"; 
  const MY_LIFF_ID = "2011153364-MOAMyDp5";
  
  let currentProfile = null;
  let modalCallback = null;

  // 0. 自訂無網址 Modal 彈窗控制函式
  function showAlert(message, callback) {
    document.getElementById("modalMsg").innerText = message;
    document.getElementById("customModal").classList.add("active");
    modalCallback = callback || null;
  }

  function closeCustomModal() {
    document.getElementById("customModal").classList.remove("active");
    if (modalCallback) {
      modalCallback();
      modalCallback = null;
    }
  }

  // 工作內容連動資料庫
  const contentOptions = {
    "M01": ["備料/上料", "機台調整/設定", "實際加工/生產", "下料/出料", "設備日常自主點檢", "設備初級保養", "清機/保養/歸位"],
    "M02": ["定期巡檢/例行檢查", "異常排除/故障維修", "潤滑/加油/保養", "更換消耗品/耗材"],
    "P01": ["毛邊去除/打磨", "表面處理/洗淨", "烘乾/乾燥", "組裝/預組裝"],
    "Q01": ["首件檢查", "自主檢查/巡檢", "成品全面檢查", "量測與紀錄", "不良品標示與隔離"],
    "D01": ["工單/派工單填寫", "生產日報填寫", "自主檢查表填寫"],
    "S01": ["工單完工結帳", "數量確認/報廢申報"],
    "T01": ["原料/半成品搬運", "成品移轉/入庫", "廢料/殘料清理搬運"],
    "A01": ["設備故障等待維修", "待料/等待支援", "工程/品質問題確認", "首件確認中/等待檢驗"],
    "PK1": ["產品包裝", "標籤貼附/列印", "裝箱/疊棧板"],
    "OTH1": ["開會/教育訓練", "環境打掃/5S整理", "協助其他單位"]
  };

  // 1. 初始化 LIFF
  async function initLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID });
      if (liff.isLoggedIn()) {
        currentProfile = await liff.getProfile();
        
        const userNameEl = document.getElementById("userName");
        if (userNameEl) {
          userNameEl.innerText = currentProfile.displayName;
        }
        
        document.getElementById("submitBtn").disabled = false;
      } else {
        liff.login();
      }
    } catch (err) {
      console.error("LIFF 初始化失敗", err);
      document.getElementById("userName").innerText = "驗證失敗";
      document.getElementById("userName").style.color = "#dc3545";
      showAlert("LIFF 載入失敗：" + err.message);
    }
  }
  initLiff();

  // 2. 工作類別連動工作內容選單
  function updateContentOptions() {
    const categorySelect = document.getElementById("workCategory");
    const contentSelect = document.getElementById("workContent");
    const selectedCategory = categorySelect.value;

    contentSelect.innerHTML = "";

    if (selectedCategory && contentOptions[selectedCategory]) {
      contentSelect.disabled = false;
      
      let defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.innerText = "-- 請選擇工作內容 --";
      contentSelect.appendChild(defaultOpt);

      contentOptions[selectedCategory].forEach(item => {
        let opt = document.createElement("option");
        opt.value = item;
        opt.innerText = item;
        contentSelect.appendChild(opt);
      });
    } else {
      contentSelect.disabled = true;
      let defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.innerText = "-- 請先選擇工作類別 --";
      contentSelect.appendChild(defaultOpt);
    }
  }

  // 3. 提交報工資料
  async function submitData() {
    if (!currentProfile || !currentProfile.userId) {
      showAlert("尚未取得您的 LINE 身份，請關閉後重新開啟頁面！");
      return;
    }

    const categorySelect = document.getElementById("workCategory");
    const contentSelect = document.getElementById("workContent");
    const workScopeInput = document.getElementById("workScope");
    const statusDiv = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    if (!categorySelect.value) {
      showAlert("請選擇工作類別！");
      return;
    }
    if (!contentSelect.value) {
      showAlert("請選擇工作內容！");
      return;
    }

    submitBtn.disabled = true;
    statusDiv.className = "loading";
    statusDiv.innerText = "資料傳送中，請稍候...";

    const payload = {
      userId: currentProfile.userId,
      userName: currentProfile.displayName,
      categoryCode: categorySelect.value,
      categoryName: categorySelect.options[categorySelect.selectedIndex].text,
      contentCode: "",
      contentName: contentSelect.value,
      workScope: workScopeInput.value
    };

    fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(result => {
      if (result.result === "success") {
        statusDiv.className = "success";
        statusDiv.innerText = result.message;
        
        // 成功時跳出自訂彈窗，點擊確定後才關閉視窗
        showAlert(result.message, function() {
          liff.closeWindow();
        });
      } else {
        statusDiv.className = "error";
        statusDiv.innerText = result.message;
        
        // 權限不足或失敗時跳出無網址自訂彈窗
        showAlert(result.message);
        submitBtn.disabled = false;
      }
    })
    .catch(error => {
      console.error("Error:", error);
      statusDiv.className = "error";
      statusDiv.innerText = "提交失敗，請檢查網路連線。";
      showAlert("提交失敗，請檢查網路連線。");
      submitBtn.disabled = false;
    });
  }
</script>
</body>
</html>
