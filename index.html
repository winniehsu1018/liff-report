<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 關鍵：跳脫 GAS iframe 限制 -->
  <base target="_top">

  <title>現場作業報工系統</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      margin: 0;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      margin: 20px auto;
    }

    h2 {
      color: #212529;
      font-size: 20px;
      margin-top: 0;
      text-align: center;
    }

    .user-info {
      background: #e9ecef;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      color: #495057;
      margin-bottom: 15px;
    }

    #userName {
      color: #0d6efd;
    }

    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
      color: #343a40;
    }

    select,
    input,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      box-sizing: border-box;
      font-size: 16px;
    }

    select:focus,
    input:focus {
      border-color: #06C755;
      outline: none;
    }

    button {
      background-color: #06C755;
      color: white;
      font-weight: bold;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      border-radius: 8px;
      font-size: 18px;
    }

    button:disabled {
      background-color: #adb5bd;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      min-height: 24px;
      line-height: 1.5;
    }

    .success {
      color: #198754;
    }

    .error {
      color: #dc3545;
    }

    .loading {
      color: #0d6efd;
    }

    /* ==========================
       診斷區
       ========================== */
    #debugBox {
      margin-top: 20px;
      padding: 12px;
      background: #212529;
      color: #ffffff;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-all;
    }

    #debugBox h3 {
      margin-top: 0;
      font-size: 15px;
      color: #ffffff;
    }

    .debug-success {
      color: #7CFC00;
    }

    .debug-error {
      color: #ff6b6b;
    }

    .debug-normal {
      color: #ffffff;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>現場作業報工系統</h2>

  <!-- 使用者 -->
  <div class="user-info">
    填報人員：<span id="userName">身份驗證中...</span>
  </div>

  <!-- 工作類別 -->
  <label for="workCategory">工作類別 *</label>
  <select id="workCategory" onchange="updateContentOptions()">
    <option value="">-- 請選擇工作類別 --</option>
    <option value="M01">M01 機台操作/生產操作</option>
    <option value="M02">M02 機台巡檢(設備維護)</option>
    <option value="P01">P01 前/後加工(預處理)</option>
    <option value="Q01">Q01 品質</option>
    <option value="D01">D01 文件處理</option>
    <option value="S01">S01 系統結帳</option>
    <option value="T01">T01 搬運</option>
    <option value="A01">A01 異常處理</option>
    <option value="PK1">PK1 包裝</option>
    <option value="OTH1">OTH1 其他</option>
  </select>

  <!-- 工作內容 -->
  <label for="workContent">工作內容 *</label>
  <select id="workContent" disabled>
    <option value="">-- 請先選擇工作類別 --</option>
  </select>

  <!-- 作業範圍 -->
  <label for="workScope">作業範圍 (選填)</label>
  <input type="text" id="workScope" placeholder="請填寫機台號碼或工單件號">

  <!-- 提交 -->
  <button id="submitBtn" onclick="submitData()" disabled>提交報工資料</button>

  <div id="status"></div>

  <!-- LIFF 診斷資訊 -->
  <div id="debugBox">
    <h3>🔧 LIFF 診斷資訊</h3>
    <div id="debug"></div>
  </div>
</div>

<script>
// =====================================================
// 1. 基本設定
// =====================================================
const MY_LIFF_ID = "2011153364-MOAMyDp5";
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyHHYAVUp5yNV8G26wsajzpMMaAlBzwZRTxGbOyeyESQOvM2klYdALrKf7YlM37YEkW/exec";

let currentUserName = "";

// =====================================================
// 2. 工作內容對照表
// =====================================================
const contentMap = {
  "M01": [
    { code: "M01-1", text: "上料" },
    { code: "M01-2", text: "下料" },
    { code: "M01-3", text: "換刀" },
    { code: "M01-4", text: "換批" }
  ],
  "M02": [
    { code: "M02-1", text: "巡視多台機台外觀、清潔、異音、核心參數" }
  ],
  "P01": [
    { code: "P01-1", text: "甩油、零件清洗、分裝" }
  ],
  "Q01": [
    { code: "Q01-1", text: "首末件確認" },
    { code: "Q01-2", text: "抽檢" },
    { code: "Q01-3", text: "重測" },
    { code: "Q01-4", text: "挑料、挑鐵屑" }
  ],
  "D01": [
    { code: "D01-1", text: "列印、整理、歸檔" }
  ],
  "S01": [
    { code: "S01-1", text: "系統入單、結帳" }
  ],
  "T01": [
    { code: "T01-1", text: "材料、半成品、成品" }
  ],
  "A01": [
    { code: "A01-1", text: "排除異常、料片碰撞、刀具撞擊、尺寸異常" }
  ],
  "PK1": [
    { code: "PK1-1", text: "零件包裝" }
  ],
  "OTH1": [
    { code: "OTH1-1", text: "其他(請填寫)" }
  ]
};

// =====================================================
// 3. 診斷工具
// =====================================================
function debugLog(message, type = "normal") {
  const debug = document.getElementById("debug");
  const div = document.createElement("div");
  div.className = type === "success" ? "debug-success" : type === "error" ? "debug-error" : "debug-normal";
  div.innerText = message;
  debug.appendChild(div);
  console.log(message);
}

// =====================================================
// 4. LIFF 初始化 (含 GAS 沙盒相容與 Timeout)
// =====================================================
window.onload = async function () {
  const userNameElement = document.getElementById("userName");
  const submitBtn = document.getElementById("submitBtn");
  const statusDiv = document.getElementById("status");

  if (typeof liff === "undefined") {
    debugLog("❌ LIFF SDK：沒有載入", "error");
    userNameElement.innerText = "LIFF SDK 載入失敗";
    statusDiv.className = "error";
    statusDiv.innerText = "LINE LIFF SDK 無法載入";
    return;
  }

  debugLog("✓ LIFF SDK：載入成功", "success");
  debugLog("目前 URL：" + window.location.href);

  try {
    userNameElement.innerText = "正在初始化 LIFF...";
    statusDiv.className = "loading";
    statusDiv.innerText = "正在連線 LINE...";

    debugLog("① 準備執行 liff.init()");

    // 設定 6 秒 Timeout 控制機制
    const initPromise = liff.init({ liffId: MY_LIFF_ID });
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error("liff.init() 被 GAS iframe 沙盒攔截")), 6000)
    );

    await Promise.race([initPromise, timeoutPromise]);

    debugLog("② liff.init() 成功", "success");
    statusDiv.innerText = "LIFF 初始化成功";

    let loggedIn = liff.isLoggedIn();
    debugLog("liff.isLoggedIn()：" + loggedIn, loggedIn ? "success" : "error");

    if (!loggedIn) {
      userNameElement.innerText = "正在登入 LINE...";
      statusDiv.innerText = "正在進行 LINE 登入";
      debugLog("⚠ 尚未登入，執行 liff.login()");
      liff.login();
      return;
    }

    userNameElement.innerText = "正在取得 LINE 身分...";
    const profile = await liff.getProfile();
    debugLog("✓ liff.getProfile()：成功", "success");

    currentUserName = profile.displayName;
    userNameElement.innerText = currentUserName;
    statusDiv.className = "success";
    statusDiv.innerText = "✓ 身分驗證成功";
    submitBtn.disabled = false;

  } catch (err) {
    console.error("LIFF ERROR", err);
    debugLog("❌ " + err.message, "error");

    // 當卡在 GAS iframe 時，彈出開窗按鈕讓使用者手動跳脫
    userNameElement.innerHTML = `<span style="color:red;">沙盒限制</span>`;
    statusDiv.className = "error";
    statusDiv.innerHTML = `受限於 GAS 嵌入頁面，<br><a href="https://liff.line.me/${MY_LIFF_ID}" target="_top" style="color:#0d6efd;font-weight:bold;">👉 點此開啟原生 LINE 報工頁面</a>`;
    submitBtn.disabled = true;
  }
};

// =====================================================
// 5. 工作內容連動
// =====================================================
function updateContentOptions() {
  const categorySelect = document.getElementById("workCategory");
  const contentSelect = document.getElementById("workContent");
  const selectedCategory = categorySelect.value;

  contentSelect.innerHTML = '<option value="">-- 請選擇工作內容 --</option>';

  if (selectedCategory && contentMap[selectedCategory]) {
    contentSelect.disabled = false;
    contentMap[selectedCategory].forEach(function(item) {
      const option = document.createElement("option");
      option.value = item.code;
      option.innerText = item.code + " " + item.text;
      contentSelect.appendChild(option);
    });
  } else {
    contentSelect.disabled = true;
  }
}

// =====================================================
// 6. 提交資料
// =====================================================
async function submitData() {
  const categorySelect = document.getElementById("workCategory");
  const contentSelect = document.getElementById("workContent");
  const scopeInput = document.getElementById("workScope");
  const btn = document.getElementById("submitBtn");
  const statusDiv = document.getElementById("status");

  if (!currentUserName) {
    alert("尚未完成 LINE 身分驗證");
    return;
  }

  const categoryCode = categorySelect.value;
  if (!categoryCode) {
    alert("請選擇工作類別！");
    return;
  }

  const contentCode = contentSelect.value;
  if (!contentCode) {
    alert("請選擇工作內容！");
    return;
  }

  btn.disabled = true;
  statusDiv.className = "loading";
  statusDiv.innerText = "資料傳送中...";

  const payload = {
    userName: currentUserName,
    categoryCode: categoryCode,
    categoryName: categorySelect.options[categorySelect.selectedIndex].text,
    contentCode: contentCode,
    contentName: contentSelect.options[contentSelect.selectedIndex].text,
    workScope: scopeInput.value.trim()
  };

  try {
    const response = await fetch(GAS_WEB_APP_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    const data = await response.json();

    if (data.result === "success") {
      statusDiv.className = "success";
      statusDiv.innerText = "✅ 報工成功！";

      setTimeout(function() {
        if (typeof liff !== "undefined" && liff.isInClient()) {
          liff.closeWindow();
        }
      }, 1200);
    } else {
      throw new Error(data.message || "GAS 回傳錯誤");
    }
  } catch (err) {
    statusDiv.className = "error";
    statusDiv.innerText = "提交失敗：" + (err.message || err.toString());
    btn.disabled = false;
  }
}
</script>

</body>
</html>
